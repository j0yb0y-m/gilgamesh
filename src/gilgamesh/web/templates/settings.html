{% extends "base.html" %}

{% block title %}Settings — Gilgamesh{% endblock %}

{% block content %}
<section id="settings">
  <h2>Settings</h2>
  {% if saved %}<p role="status">Settings saved.</p>{% endif %}

  <form method="post" action="/settings">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />

    <label for="retention_days">Keep alerts for (days)</label>
    <input
      id="retention_days"
      name="retention_days"
      type="number"
      min="1"
      max="365"
      value="{{ retention_days }}"
      required
    />

    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
