{% extends "base.html" %}

{% block title %}Sign in — Gilgamesh{% endblock %}

{% import "_icons.html" as icons %}

{% block content %}
<section id="login" class="mx-auto max-w-sm">
  <div class="mb-5 flex flex-col items-center gap-2 pt-4 text-center">
    <span class="brand-mark size-10 text-lg">{{ icons.icon("shield") }}</span>
    <h1 class="page-title">Sign in</h1>
  </div>

  <form method="post" action="/login" class="card">
    <div class="card-body grid gap-4">
      <div>
        <label class="field" for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          class="input"
        />
      </div>

      <div>
        <label class="field" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="input"
        />
      </div>

      <button type="submit" class="btn btn-primary">{{ icons.icon("lock") }}Sign in</button>
    </div>
  </form>
</section>
{% endblock %}
