# Hardware watchdog for the inline-bridge appliance.
#
# An inline Pi is a single point of failure: while it is down, no frame crosses br0.
# A hardware watchdog cannot keep traffic flowing during a reboot, but it does bound
# the outage from a *hang* (stalled kernel, wedged systemd) to one reboot instead of
# an indefinite outage. It does nothing for a power cut or a dead NIC.
#
# Installed by install.sh as /etc/systemd/system.conf.d/10-gilgamesh-watchdog.conf.
# systemd reads it at boot (or after `systemctl daemon-reexec`), so the first reboot
# after installation is what arms it. Check with:
#
#     systemctl show --property=RuntimeWatchdogUSec
#
# 30s is deliberately generous for a Pi on an SD card: a shorter value turns a long
# fsync stall into a reboot loop. RebootWatchdogSec keeps a wedged shutdown moving.
#
# Remove this file and reboot to opt out.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
