# Gilgamesh's two service accounts (sysusers.d(5), format verified on systemd 257).
#
#   gilgamesh         — the web UI/API process
#   gilgamesh-sensor  — the packet-capture process
#
# The `m` line puts the sensor into the web user's group. That group membership is the
# whole access-control story between the two processes: they are sandboxed separately
# but share exactly one object, the SQLite database in /var/lib/gilgamesh, which the web
# unit creates as 0770 gilgamesh:gilgamesh (StateDirectory=, StateDirectoryMode=) and
# which the sensor reaches as a member of the group.
#
# `u!` creates a fully locked account: no password and no SSH, even by key.
#
# No home directory is declared on purpose. systemd-sysusers(8) only writes the passwd
# record — it does not create directories — and recommends omitting the field unless a
# program needs it. Both processes are given their writable directory by the unit files,
# not by a home directory.

u! gilgamesh        - "Gilgamesh web UI and API"           -
u! gilgamesh-sensor - "Gilgamesh packet-capture service"   -
m  gilgamesh-sensor gilgamesh
