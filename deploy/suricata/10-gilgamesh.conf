# Suricata drop-in — installed as /etc/systemd/system/suricata.service.d/10-gilgamesh.conf
# by install.sh, and only when Suricata is present.
#
# Why it exists: on Debian, suricata.service runs Suricata under its own sandbox. The
# ruleset Gilgamesh installs lives in /var/lib/suricata/rules, and Suricata must be able
# to re-read it after `suricatasc -c reload-rules` (which is what gilgamesh-rules-update
# calls). The two /etc/suricata filter files are included because suricata-update may
# rewrite them in place when the operator edits their filters.
#
# ReadWritePaths= is harmless when the paths are already writable: it only ever adds
# access for this unit. If your Suricata packaging does not sandbox the service, this
# drop-in simply has no effect.

[Service]
ReadWritePaths=/var/lib/suricata/rules /etc/suricata/disable.conf /etc/suricata/enable.conf
