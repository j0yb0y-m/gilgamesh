# journald caps — installed as /etc/systemd/journald.conf.d/10-gilgamesh.conf
#
# Why: the Raspberry Pi boots from an SD card, and an unbounded journal is both a space
# and a wear problem. The defaults (10 % of the filesystem, up to 4 GiB) are far too
# generous for a 4 GB home appliance; the values below keep two weeks of history in
# 128 MiB (journald.conf(5): SystemMaxUse= and SystemMaxFileSize= are the two knobs that
# bound the on-disk journal; MaxRetentionSec= bounds it by age).
#
# This is a system-wide setting: it also caps the journal for every other service on the
# box. Edit or delete this file if the machine is used for something else as well.

[Journal]
Storage=persistent
SystemMaxUse=128M
SystemMaxFileSize=16M
MaxRetentionSec=14day
